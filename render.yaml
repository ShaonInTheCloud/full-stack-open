# Prepared deployment configuration. Importing this file does not happen automatically.
services:
  - type: web
    name: shaon-fullstack-phonebook
    runtime: node
    plan: free
    region: frankfurt
    rootDir: part3/phonebook
    buildCommand: npm ci --include=dev && npm run build:ui
    startCommand: npm start
    healthCheckPath: /info
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: MONGODB_URI
        sync: false
      - key: LOG_REQUEST_BODIES
        value: "false"
