name: Check coursework
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Build and check each app
        run: |
          for app in courseinfo unicafe anecdotes; do
            npm --prefix "part1/$app" ci
            npm --prefix "part1/$app" run build
            npm --prefix "part1/$app" run lint
          done
      - run: npm test
