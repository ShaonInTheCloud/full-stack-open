name: Check coursework
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Build and check each app
        run: |
          for app in courseinfo unicafe anecdotes; do
            npm --prefix "part1/$app" ci
            npm --prefix "part1/$app" run build
            npm --prefix "part1/$app" run lint
          done
      - name: Build and check Part 2
        run: |
          for app in courseinfo phonebook countries; do
            npm --prefix "part2/$app" ci
            npm --prefix "part2/$app" run build
            npm --prefix "part2/$app" run lint
          done
      - name: Check Part 3 backend
        run: |
          npm --prefix part3/phonebook ci
          npm --prefix part3/phonebook run build:ui
          npm --prefix part3/phonebook/frontend run lint
          npm --prefix part3/phonebook run lint
          npm --prefix part3/phonebook test
      - name: Check Part 4 Blog List
        run: |
          npm --prefix part4/bloglist ci
          npm --prefix part4/bloglist run lint
          npm --prefix part4/bloglist test
      - name: Check Part 5 frontend
        run: |
          npm --prefix part5/bloglist ci
          npm --prefix part5/bloglist run build
          npm --prefix part5/bloglist run lint
          npm --prefix part5/bloglist test
      - name: Check Part 5 browser flows
        run: |
          npm --prefix part5/e2e ci
          cd part5/e2e
          npx playwright install --with-deps chromium
          npm test
      - run: npm test
